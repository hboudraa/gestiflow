{% extends 'base.html' %}
{% load humanize %}
{% block title %}Avoir{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4"><div class="col-12 col-md-6">
  <div class="card"><div class="card-header" style="background:rgba(245,158,11,.1);"><h6 class="card-title text-warning"><i class="bi bi-arrow-counterclockwise me-2"></i>Créer un avoir</h6></div>
  <div class="card-body">
    <p>Avoir sur <strong>{{ facture.numero }}</strong> &mdash; <strong style="color:#ef4444;">{{ facture.total_ttc|floatformat:2|intcomma }} DA</strong></p>
    <form method="post">{% csrf_token %}
      <button type="submit" class="btn btn-warning me-2"><i class="bi bi-check-lg me-1"></i>Confirmer</button>
      <a href="{% url 'ventes:detail' facture.pk %}" class="btn btn-outline-secondary">Annuler</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
