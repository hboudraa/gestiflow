<div class="modal fade" id="modalEnvoyerEmail" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;">
      <div class="modal-header" style="border-bottom:1px solid var(--border-color);">
        <h5 class="modal-title" style="font-size:15px;font-weight:600;"><i class="bi bi-envelope-fill me-2 text-primary"></i>Envoyer par email</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form method="post" id="formEnvoyerEmail" action="{{ action_url }}">
        {% csrf_token %}
        <div class="modal-body">
          <div id="emailLoadingState" style="display:none;text-align:center;padding:20px;">
            <div class="spinner-border text-primary" style="width:2rem;height:2rem;"></div>
            <div style="margin-top:12px;font-size:13px;color:var(--text-secondary);">Chargement...</div>
          </div>
          <div id="emailFormContent">
            <div class="row g-3">
              <div class="col-12 col-md-8"><label class="form-label">Destinataire <span class="text-danger">*</span></label><input type="email" name="destinataire" id="emailDestinataire" class="form-control" placeholder="client@exemple.dz" required></div>
              <div class="col-12 col-md-4"><label class="form-label">CC <small style="color:var(--text-secondary);">optionnel</small></label><input type="email" name="cc" id="emailCc" class="form-control"></div>
              <div class="col-12"><label class="form-label">Objet <span class="text-danger">*</span></label><input type="text" name="sujet" id="emailSujet" class="form-control" required></div>
              <div class="col-12"><label class="form-label">Message</label><textarea name="corps" id="emailCorps" class="form-control" rows="7" style="font-family:monospace;font-size:13px;resize:vertical;"></textarea></div>
            </div>
            <div style="margin-top:12px;padding:10px 14px;background:rgba(59,130,246,.06);border-radius:8px;border:1px solid rgba(59,130,246,.15);font-size:12.5px;color:var(--text-secondary);">
              <i class="bi bi-paperclip me-1 text-primary"></i>Le PDF sera automatiquement généré et joint.
            </div>
          </div>
        </div>
        <div class="modal-footer" style="border-top:1px solid var(--border-color);">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="submit" id="btnEnvoyerEmail" class="btn btn-primary"><i class="bi bi-send me-1"></i>Envoyer</button>
        </div>
      </form>
    </div>
  </div>
</div>
