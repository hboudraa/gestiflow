{% extends 'base.html' %}
{% block title %}Supprimer fournisseur{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4"><div class="col-12 col-md-6">
  <div class="card border-danger">
    <div class="card-header" style="background:rgba(239,68,68,.1);"><h6 class="card-title text-danger"><i class="bi bi-exclamation-triangle me-2"></i>Supprimer le fournisseur</h6></div>
    <div class="card-body">
      <p>Voulez-vous supprimer <strong>{{ fournisseur.nom }}</strong> ?</p>
      <form method="post">{% csrf_token %}
        <button type="submit" class="btn btn-danger me-2"><i class="bi bi-trash me-1"></i>Supprimer</button>
        <a href="{% url 'fournisseurs:detail' fournisseur.pk %}" class="btn btn-outline-secondary">Annuler</a>
      </form>
    </div>
  </div>
</div></div>
{% endblock %}
