{% extends 'base.html' %}
{% block title %}Rapports{% endblock %}
{% block topbar_title %}Rapports & Analyses{% endblock %}
{% block content %}
<div class="page-header"><h1 class="page-title"><i class="bi bi-bar-chart-line me-2 text-primary"></i>Rapports</h1></div>
<div class="row g-3">
  {% for url_name, icon, color, title, subtitle in reports %}
  <div class="col-12 col-md-6 col-xl-4">
    <a href="{% url url_name %}" class="text-decoration-none">
      <div class="card h-100" style="transition:.2s;cursor:pointer;" onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 4px 16px rgba(0,0,0,.1)'" onmouseout="this.style.transform='';this.style.boxShadow=''">
        <div class="card-body d-flex align-items-center gap-4 py-4">
          <div style="width:56px;height:56px;border-radius:12px;background:{{ color }}20;color:{{ color }};display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;"><i class="bi {{ icon }}"></i></div>
          <div><div style="font-size:15px;font-weight:600;color:var(--text-primary);">{{ title }}</div><div style="font-size:13px;color:var(--text-secondary);">{{ subtitle }}</div></div>
          <i class="bi bi-chevron-right ms-auto" style="color:var(--text-secondary);"></i>
        </div>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
