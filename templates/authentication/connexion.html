<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Connexion — GestiFlow</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body{background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:40px;width:100%;max-width:420px;}
.login-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#1e3a5f,#3b82f6);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:26px;color:#fff;}
h2{color:#fff;font-size:22px;font-weight:700;text-align:center;margin-bottom:4px;}
.subtitle{color:#94a3b8;font-size:13px;text-align:center;margin-bottom:28px;}
.form-control{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:10px;}
.form-control:focus{background:rgba(255,255,255,.1);border-color:#3b82f6;color:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.2);}
.form-label{color:#94a3b8;font-size:13px;}
.btn-login{background:linear-gradient(135deg,#1e3a5f,#3b82f6);border:none;border-radius:10px;padding:12px;font-weight:600;font-size:14px;}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo"><i class="bi bi-lightning-charge-fill"></i></div>
  <h2>GestiFlow</h2>
  <p class="subtitle">Système de gestion d'entreprise</p>
  {% if bloque %}
  <div style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:12px;padding:16px;margin-bottom:20px;text-align:center;">
    <i class="bi bi-shield-lock-fill" style="font-size:24px;color:#ef4444;display:block;margin-bottom:8px;"></i>
    <div style="font-weight:700;color:#ef4444;font-size:14px;">Accès temporairement bloqué</div>
    <div style="color:#94a3b8;font-size:13px;margin-top:6px;">Réessayez dans : <strong style="color:#ef4444;">{{ temps_restant }}</strong></div>
  </div>
  {% else %}
  {% for msg in messages %}
  <div class="alert alert-danger alert-dismissible fade show mb-3" style="border-radius:10px;font-size:13px;">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
  {% endfor %}
  <form method="post">{% csrf_token %}
    <div class="mb-3"><label class="form-label">Identifiant</label>{{ form.username }}</div>
    <div class="mb-4"><label class="form-label">Mot de passe</label>{{ form.password }}</div>
    <button type="submit" class="btn btn-login btn-primary w-100"><i class="bi bi-box-arrow-in-right me-2"></i>Se connecter</button>
  </form>
  {% endif %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
