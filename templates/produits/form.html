{% extends 'base.html' %}
{% block title %}{{ titre }}{% endblock %}
{% block topbar_title %}{{ titre }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-9">
    <div class="card">
      <div class="card-header"><h6 class="card-title">{{ titre }}</h6></div>
      <div class="card-body">
        <form method="post" enctype="multipart/form-data">{% csrf_token %}
          <div class="row g-3">{% for field in form %}
            <div class="{% if field.name == 'description' %}col-12{% else %}col-12 col-md-6{% endif %}">
              <label class="form-label">{{ field.label }}</label>{{ field }}
              {% if field.errors %}<div class="text-danger" style="font-size:12px;">{{ field.errors }}</div>{% endif %}
            </div>{% endfor %}
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Enregistrer</button>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">Annuler</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
