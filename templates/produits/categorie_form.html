{% extends 'base.html' %}
{% block title %}{{ titre }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-12 col-md-6">
  <div class="card"><div class="card-header"><h6 class="card-title">{{ titre }}</h6></div>
  <div class="card-body"><form method="post">{% csrf_token %}
    {% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}</div>{% endfor %}
    <div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Enregistrer</button><a href="{% url 'produits:categories' %}" class="btn btn-outline-secondary">Annuler</a></div>
  </form></div></div>
</div></div>
{% endblock %}
